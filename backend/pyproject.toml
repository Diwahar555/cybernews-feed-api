[project]
name = "cybernews-feed-api"
version = "1.0.0"
description = "Production-oriented cybersecurity news aggregation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<0.163",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "feedparser>=6.0.11,<7",
  "beautifulsoup4>=4.13,<5",
  "tenacity>=9,<10",
  "apscheduler>=3.10,<4",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "aiosqlite>=0.21,<1",
  "ruff>=0.12,<1",
  "coverage[toml]>=7.10,<8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["app"]
branch = true

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
